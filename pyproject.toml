[project]
name = "ocean-sim"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "gymnasium>=0.29",
  "matplotlib>=3.7",
  "pydantic>=2.6",
  "typer>=0.12",
  "torch>=2.2",
  "tqdm>=4.66",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
ocean = "ocean.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

